[project]
name = "isolated-web-clone"
version = "0.1.0"
description = "Airgapped web environment for agent training: bundle format, diode protocol, and agent skill docs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "blake3>=1.0.9",
    "jsonschema>=4.26.0",
    "pynacl>=1.6.2",
]

[dependency-groups]
dev = [
    "faker>=40.39.0",
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
