# Egress metric registry.
#
# egress-metrics-spec.md §8 and agent-sandbox-spec.md §7. Compiled into both the
# sender and the reader; names never travel on the wire, only IDs do. Adding or
# removing a metric is a registry version bump plus a sender release plus a reader
# release. IDs are NEVER reused: a reader compiled against an older registry must not
# silently reinterpret a value.
#
# `scale` is the divisor the reader applies to the int32 wire value. `delta` means the
# value is a change since the last frame rather than an absolute (frame flags bit 0).

registry_version = 2
max_metrics = 64
schema_version = 1


[metrics.1]
name = "sys.heartbeat"
unit = "count"
scale = 1
delta = true
source = "sender"

