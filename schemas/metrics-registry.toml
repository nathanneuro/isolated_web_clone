# Egress metric registry.
#
# Generated from the tables in docs/egress-metrics-spec.md §8,
# docs/agent-sandbox-spec.md §7, and docs/log-diode-spec.md §8. Compiled into both
# the sender and the reader; names never travel on the wire, only IDs do.
#
# IDs are NEVER reused. Adding or removing a metric is a registry version bump plus a
# sender release plus a reader release. A reader compiled against an older registry
# must not silently reinterpret a value, which is why [retired] below is a list of
# holes rather than an absence.
#
# `scale` is the divisor the reader applies to the int32 wire value. `delta` means the
# value is a change since the last frame (frame flags bit 0).
#
# `priority` decides what rides in a frame when the registry is larger than one frame
# holds, which it is. `always` metrics are in every frame -- they are the ones whose
# ABSENCE is the alarm. Everything else rotates round-robin. Selecting by lowest ID
# instead would starve whichever block was added last, and the newest blocks are the
# log, sandbox, broker, and driver telemetry, which is backwards.

registry_version = 4
max_metrics = 64
schema_version = 1

# Holes. Training quantities from v1; this environment evaluates, it does not train.
[retired]

53 = "run.loss"
60 = "run.lr"
61 = "run.grad_norm"

